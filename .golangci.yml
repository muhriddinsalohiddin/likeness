version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # read-side closes and clean-ups whose errors carry no information
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - os.Remove
        # a bufio.Writer keeps its first error and returns it from Flush
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteString
        # a response that cannot be written has nobody left to be told
        - (net/http.ResponseWriter).Write
  exclusions:
    paths:
      - ^bench/
    rules:
      # cgo call sites confuse the duplicate-expression check
      - path: internal/ortx/
        linters: [gocritic]
        text: dupSubExpr
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - ^bench/
